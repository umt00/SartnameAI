[project]
name = "sartnameai"
version = "0.1.0"
description = "Kurumsal Teknik Şartname Hazırlama ve Karşılaştırma Asistanı"
readme = "README.md"
authors = [
    { name = "Umut Arslan", email = "umtarsln00@icloud.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.4.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pdfplumber>=0.11.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-docx>=1.1.0",
    "rich>=13.0.0",
    "openai>=1.0.0",
    "azure-storage-blob>=12.19.0",
    "azure-identity>=1.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.uv]
package = false
